services:
  - type: web
    name: phms
    env: python
    pythonVersion: 3.11.9
    plan: free
    buildCommand: pip install -r PHMS/requirements.txt
    startCommand: gunicorn -w 1 -b 0.0.0.0:$PORT PHMS.wsgi:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: ENABLE_SCHEDULER
        value: "1"
      - key: ALLOW_INSECURE_RATE_LIMITING
        value: "1"
