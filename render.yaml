services:
  - type: web
    name: phms-web
    runtime: python
    rootDir: PHMS
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: ENABLE_SCHEDULER
        value: "0"
      - key: RATELIMIT_STORAGE_URI
        value: memory://
      - key: SECRET_KEY
        generateValue: true
      - key: SECURITY_PASSWORD_SALT
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: phms-db
          property: connectionString

databases:
  - name: phms-db
    plan: free