<!DOCTYPE html>
<html>
<head>
    <title>Login | PHMS</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style/login.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style/loading-states.css') }}">
    <script src="{{ url_for('static', filename='js/loading-states.js') }}"></script>

    <script>
    function getCsrfToken() {
        const el = document.querySelector('meta[name="csrf-token"]');
        return el ? el.getAttribute('content') : '';
    }
    function showPageToast(message, isError) {
        const t = document.createElement('div');
        t.className = 'phms-page-toast';
        t.textContent = message;
        t.style.background = isError ? '#ef4444' : '#10b981';
        document.body.appendChild(t);
        setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3500);
    }
    </script>
</head>

<body>

<div class="box">
    <h2>User Login</h2>

    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login(event)">Login</button>

    <!-- Register link -->
    <div class="register-link">
        New user? <a href="/register">Register</a>
    </div>
    <div class="register-link">
        Forgot your password? <a href="/forgotPassword">Reset it</a>
    </div>
</div>

<script>
function login(event) {
    const loginBtn = event ? event.target : null;
    if (loginBtn) {
        if (window.PHMSLoading) {
            window.PHMSLoading.setButtonLoading(loginBtn, 'Signing in...');
        } else {
            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in...';
        }
    }

    fetch('/login', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCsrfToken()
        },
        body: JSON.stringify({
            email: email.value,
            password: password.value
        })
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            if (window.PHMSLoading) {
                window.PHMSLoading.showOverlay('Loading dashboard...');
            }
            window.location = "/dashboard";
        } else {
            showPageToast(data.message, true);
            if (loginBtn) {
                if (window.PHMSLoading) {
                    window.PHMSLoading.clearButtonLoading(loginBtn);
                } else {
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Login';
                }
            }
        }
    })
    .catch(() => {
        showPageToast('Login failed. Please try again.', true);
        if (loginBtn) {
            if (window.PHMSLoading) {
                window.PHMSLoading.clearButtonLoading(loginBtn);
            } else {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        }
    });
}
</script>

</body>
</html>
