<!DOCTYPE html>
<html>
<head>
    <title>Login | PHMS</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style/login.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style/loading-states.css') }}">
    <script src="{{ url_for('static', filename='js/loading-states.js') }}"></script>
</head>

<body>

<div class="box">
    <h2>User Login</h2>

    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button id="loginBtn">Login</button>

    <!-- Register link -->
    <div class="register-link">
        New user? <a href="{{ url_for('register') }}">Register</a>
    </div>
    <div class="register-link">
        Forgot your password? <a href="{{ url_for('forgot_password') }}">Reset it</a>
    </div>
</div>

<script src="{{ url_for('static', filename='js/login.js') }}"></script>

</body>
</html>
