<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}PHMS | Personal Health Monitoring System{% endblock %}</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='style/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style/loading-states.css') }}">

    <script src="{{ url_for('static', filename='js/loading-states.js') }}"></script>
    <!-- Shared notification utilities -->
    <script src="{{ url_for('static', filename='js/notifications-common.js') }}"></script>

    {% block head_extra %}{% endblock %}

</head>

<body>

    <!-- ===== Navigation Bar (Visible on all pages except login/register) ===== -->
    <nav class="navbar">
        <a href="{{ url_for('dashboard') }}" class="logo">PHMS</a>
        <div class="nav-links">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('health_page') }}">Health Data</a>
            <a href="{{ url_for('smartwatch_page') }}">Smartwatch</a>
            <a href="{{ url_for('medication_page') }}">Medication</a>
            <a href="{{ url_for('reports.reports_home') }}">Reports</a>
            <div class="profile-menu">
                <a class="profile-menu-trigger" href="{{ url_for('profile') }}" aria-haspopup="true">Profile</a>
                <div class="profile-menu-dropdown" role="menu" aria-label="Profile actions">
                    <a role="menuitem" href="{{ url_for('profile') }}">View profile</a>
                    <a role="menuitem" href="{{ url_for('reports.reports_home') }}">Health reports</a>
                    <a role="menuitem" href="{{ url_for('notifications_page') }}">Notifications</a>
                    <form class="profile-menu-logout" method="post" action="{{ url_for('logout') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <button type="submit" role="menuitem">🚪 Logout</button>
                    </form>
                </div>
            </div>
            
            <!-- Notification Bell -->
            <div class="notification-container">
                <a href="{{ url_for('notifications_page') }}" class="notification-bell-link" aria-label="Notifications">
                    <span class="bell-icon">🔔</span>
                    <span class="notification-badge" id="notificationBadge" style="display: none;">0</span>
                </a>
                
                <!-- Notification Dropdown -->
                <div class="notification-dropdown" id="notificationDropdown">
                    <div class="notification-header">
                        <h3>Notifications</h3>
                        <button class="mark-all-read" id="dropdownMarkAllRead" title="Mark all as read">✓</button>
                    </div>
                    <div class="notification-list" id="notificationList">
                        <div class="notification-loading">Loading...</div>
                    </div>
                    <a href="{{ url_for('notifications_page') }}" class="view-all-notifications">View All Notifications →</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- ===== Page Content ===== -->
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <!-- ===== Footer ===== -->
    <footer>
        © 2026 Personal Health Monitoring System
    </footer>
    <script src="{{ url_for('static', filename='js/notifications-dropdown.js') }}"></script>

</body>
</html>
