<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}PHMS | Personal Health Monitoring System{% endblock %}</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='style/base.css') }}">

    {% block head_extra %}{% endblock %}

    <script>
        window.getCsrfToken = function () {
            const el = document.querySelector('meta[name="csrf-token"]');
            return el ? el.getAttribute('content') : '';
        };
    </script>
</head>

<body>

    <!-- ===== Navigation Bar (Visible on all pages except login/register) ===== -->
    <nav class="navbar">
        <a href="/dashboard" class="logo">PHMS</a>
        <div>
            <a href="/dashboard">Dashboard</a>
            <a href="/health">Health Data</a>
            <a href="/medication">Medication</a>
            <a href="/reports">Reports</a>
            <a href="/profile">Profile</a>
            <!-- <a href="/logout" class="logout">Logout</a>  -->
        </div>
    </nav>

    <!-- ===== Page Content ===== -->
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <!-- ===== Footer ===== -->
    <footer>
        © 2026 Personal Health Monitoring System
    </footer>

</body>
</html>
