<!DOCTYPE html>
<html>
<head>
    <title>Set New Password | PHMS</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style/reset_password.css') }}">
</head>
<body>
    <div class="card">
        <h2>Set a new password</h2>
        {% if message %}
        <div class="message">{{ message }}</div>
        {% endif %}
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input id="password" name="password" type="password" placeholder="New password" required>
            <input id="confirm_password" name="confirm_password" type="password" placeholder="Confirm password" required>
            <button type="submit">Update Password</button>
        </form>
        <div class="link">
            <a href="/login">Back to login</a>
        </div>
    </div>
</body>
</html>
