<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password | PHMS</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style/forgot_password.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style/loading-states.css') }}">
    <script src="{{ url_for('static', filename='js/loading-states.js') }}"></script>
    <script>
    function getCsrfToken() {
        const el = document.querySelector('meta[name="csrf-token"]');
        return el ? el.getAttribute('content') : '';
    }
    function showPageToast(message, isError) {
        const t = document.createElement('div');
        t.className = 'phms-page-toast';
        t.textContent = message;
        t.style.background = isError ? '#ef4444' : '#10b981';
        document.body.appendChild(t);
        setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3500);
    }

    function requestReset(event) {
        const email = document.getElementById('email').value.trim();

        if (!email) {
            showPageToast('Please enter your email.', true);
            return;
        }

        const button = event ? event.target : null;
        if (button) {
            if (window.PHMSLoading) {
                window.PHMSLoading.setButtonLoading(button, 'Sending OTP...');
            } else {
                button.disabled = true;
                button.textContent = 'Sending OTP...';
            }
        }

        fetch('/forgotPassword', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCsrfToken()
            },
            body: JSON.stringify({ email: email })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                showPageToast(data.message || 'OTP has been sent to your email. Redirecting...', false);
                // Store email in sessionStorage before redirecting
                sessionStorage.setItem('reset_email', email);
                // Redirect to reset password page
                if (window.PHMSLoading) {
                    window.PHMSLoading.showOverlay('Redirecting...');
                }
                window.location.href = '/resetPassword';
            } else {
                showPageToast(data.message || 'Failed to send OTP.', true);
                if (button) {
                    if (window.PHMSLoading) {
                        window.PHMSLoading.clearButtonLoading(button);
                    } else {
                        button.disabled = false;
                        button.textContent = 'Send Password Reset OTP';
                    }
                }
            }
        })
        .catch(() => {
            showPageToast('Failed to request reset. Please try again.', true);
            if (button) {
                if (window.PHMSLoading) {
                    window.PHMSLoading.clearButtonLoading(button);
                } else {
                    button.disabled = false;
                    button.textContent = 'Send Password Reset OTP';
                }
            }
        });
    }
    </script>
</head>
<body>
    <div class="card">
        <h2>Reset your password</h2>
        <p>Enter your email to receive a password reset OTP.</p>
        <input id="email" type="email" placeholder="you@example.com" required>
        <button onclick="requestReset(event)">Send Password Reset OTP</button>
        <div class="link">
            <a href="/login">Back to login</a>
        </div>
    </div>
</body>
</html>
