<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password | PHMS</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style/forgot_password.css') }}">
    <script>
    function getCsrfToken() {
        const el = document.querySelector('meta[name="csrf-token"]');
        return el ? el.getAttribute('content') : '';
    }

    function requestReset() {
        const email = document.getElementById('email').value.trim();
        
        if (!email) {
            alert('Please enter your email.');
            return;
        }

        const button = event.target;
        button.disabled = true;
        button.textContent = 'Sending OTP...';

        fetch('/forgotPassword', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCsrfToken()
            },
            body: JSON.stringify({ email: email })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                alert(data.message || 'OTP has been sent to your email. Redirecting...');
                // Store email in sessionStorage before redirecting
                sessionStorage.setItem('reset_email', email);
                // Redirect to reset password page
                window.location.href = '/resetPassword';
            } else {
                alert(data.message || 'Failed to send OTP.');
                button.disabled = false;
                button.textContent = 'Send Password Reset OTP';
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Failed to request reset. Please try again.');
            button.disabled = false;
            button.textContent = 'Send Password Reset OTP';
        });
    }
    </script>
</head>
<body>
    <div class="card">
        <h2>Reset your password</h2>
        <p>Enter your email to receive a password reset OTP.</p>
        <input id="email" type="email" placeholder="you@example.com" required>
        <button onclick="requestReset()">Send Password Reset OTP</button>
        <div class="link">
            <a href="/login">Back to login</a>
        </div>
    </div>
</body>
</html>
