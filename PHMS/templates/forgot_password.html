<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password | PHMS</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style/forgot_password.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style/loading-states.css') }}">
    <script src="{{ url_for('static', filename='js/loading-states.js') }}"></script>
</head>
<body>
    <div class="card">
        <h2>Reset your password</h2>
        <p>Enter your email to receive a password reset OTP.</p>
        <input id="email" type="email" placeholder="you@example.com" required>
        <button id="requestResetBtn">Send Password Reset OTP</button>
        <div class="link">
            <a href="/login">Back to login</a>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/forgot_password.js') }}"></script>
</body>
</html>
