<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password | PHMS</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style/forgot_password.css') }}">
    <script>
    function getCsrfToken() {
        const el = document.querySelector('meta[name="csrf-token"]');
        return el ? el.getAttribute('content') : '';
    }
    function requestReset() {
        const email = document.getElementById('email').value;
        if (!email) {
            alert('Please enter your email.');
            return;
        }
        fetch('/forgotPassword', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCsrfToken()
            },
            body: JSON.stringify({ email: email })
        })
        .then(res => res.json())
        .then(data => {
            alert(data.message || 'If that email exists, a reset link has been sent.');
        })
        .catch(() => alert('Failed to request reset link.'));
    }
    </script>
</head>
<body>
    <div class="card">
        <h2>Reset your password</h2>
        <p>Enter your email to receive a password reset link.</p>
        <input id="email" type="email" placeholder="you@example.com" required>
        <button onclick="requestReset()">Send Reset Link</button>
        <div class="link">
            <a href="/login">Back to login</a>
        </div>
    </div>
</body>
</html>
