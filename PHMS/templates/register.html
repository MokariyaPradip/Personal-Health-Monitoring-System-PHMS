<!DOCTYPE html>
<html>
<head>
    <title>Register | PHMS</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style/register.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style/loading-states.css') }}">
    <script src="{{ url_for('static', filename='js/loading-states.js') }}"></script>

    <script>
    function getCsrfToken() {
        const el = document.querySelector('meta[name="csrf-token"]');
        return el ? el.getAttribute('content') : '';
    }
    function showPageToast(message, isError) {
        const t = document.createElement('div');
        t.className = 'phms-page-toast';
        t.textContent = message;
        t.style.background = isError ? '#ef4444' : '#10b981';
        document.body.appendChild(t);
        setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3500);
    }
    </script>
</head>

<body>

<div class="box">
    <h2>User Registration</h2>

    <input id="username" placeholder="Username">
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <input id="age" type="number" placeholder="Age">

    <select id="gender">
        <option value="">Select Gender</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
    </select>

    <input id="height" type="number" step="0.1" placeholder="Height (cm)">
    <input id="weight" type="number" step="0.1" placeholder="Weight (kg)">

    <button onclick="register(event)">Register</button>

        <!-- login link -->
    <div class="login-link">
        Already had an Account? <a href="/login">login</a>
    </div>
</div>

<script>
function register(event) {
    const registerBtn = event ? event.target : null;
    if (registerBtn) {
        if (window.PHMSLoading) {
            window.PHMSLoading.setButtonLoading(registerBtn, 'Creating account...');
        } else {
            registerBtn.disabled = true;
            registerBtn.textContent = 'Creating account...';
        }
    }

    fetch('/register', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCsrfToken()
        },
        body: JSON.stringify({
            username: username.value,
            email: email.value,
            password: password.value,
            age: age.value,
            gender: gender.value,
            height: height.value,
            weight: weight.value
        })
    })
    .then(res => res.json())
    .then(data => {
        showPageToast(data.message, !data.success);
        if (data.success) {
            if (window.PHMSLoading) {
                window.PHMSLoading.showOverlay('Redirecting to login...');
            }
            window.location = "/login";
            return;
        }

        if (registerBtn) {
            if (window.PHMSLoading) {
                window.PHMSLoading.clearButtonLoading(registerBtn);
            } else {
                registerBtn.disabled = false;
                registerBtn.textContent = 'Register';
            }
        }
    })
    .catch(() => {
        showPageToast('Registration failed. Please try again.', true);
        if (registerBtn) {
            if (window.PHMSLoading) {
                window.PHMSLoading.clearButtonLoading(registerBtn);
            } else {
                registerBtn.disabled = false;
                registerBtn.textContent = 'Register';
            }
        }
    });
}
</script>

</body>
</html>
